# Nixpacks config for Railway — explicit build/run commands
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]
aptPkgs = ["openssl"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = [
  "bun run prisma generate",
  "bun run next build",
  "mkdir -p .next/standalone/.next",
  "cp -r .next/static .next/standalone/.next/",
  "cp -r public .next/standalone/",
  "cp -r prisma .next/standalone/",
]

[start]
cmd = "NODE_ENV=production PORT=$PORT node .next/standalone/server.js"
