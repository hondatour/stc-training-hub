# Nixpacks config for Railway
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]
aptPkgs = ["openssl"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = [
  "bun run prisma generate",
  "bun run next build",
]

[start]
cmd = "mkdir -p /data && bun run prisma db push --accept-data-loss && next start -p ${PORT:-3000}"
